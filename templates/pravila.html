<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Правила - Фантазариум</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/lang.js"></script>
</head>
<body>

    <div class="zvezdy"></div>

    <div class="kosmos">
        <div class="planeta gazoviy"></div>
        <div class="planeta ledyanoy"></div>
        <div class="s-kolcami">
            <div class="telo"></div>
            <div class="kolco"></div>
            <div class="kolco kolco-2"></div>
        </div>
        <div class="kometa kometa-1"></div>
    </div>

    <div class="container">
        <h2 data-t="pravila">Правила игры</h2>

        <div class="pravila-text" id="tekst-pravil"></div>

        <div class="opisanie">
            <div class="punkt">
                <span class="cifra">6</span>
                <span class="podpis" id="p1"></span>
            </div>
            <div class="punkt">
                <span class="cifra">120</span>
                <span class="podpis" id="p2"></span>
            </div>
            <div class="punkt">
                <span class="cifra">30</span>
                <span class="podpis" id="p3"></span>
            </div>
        </div>

        <a href="/glavnaya" class="ssylka-nazad" data-t="na_glavnuyu">На главную</a>
    </div>

    <script>

                    "<b>Замена:</b> можно поменять все свои карточки за 5 очков.",
                    "<b>Победа:</b> первый, кто наберёт 30 очков."
                ]
            },
            en: {
                p1: "cards in hand", p2: "seconds per turn", p3: "points to win",
                text: [
                    "<b>Players:</b> 4 to 7. Everyone holds 6 cards.",

            },
            es: {
                p1: "cartas en mano", p2: "segundos por turno", p3: "puntos para ganar",

                    "<b>Cambio:</b> puedes cambiar todas tus cartas por 5 puntos.",
                    "<b>Victoria:</b> el primero en llegar a 30 puntos."
                ]
            },
            de: {

                    "Zusätzlich gibt es 1 Punkt für jede Stimme auf deine Karte.",
                    "<b>Tausch:</b> die ganze Hand kann für 5 Punkte getauscht werden.",
                    "<b>Sieg:</b> wer zuerst 30 Punkte hat."
                ]
            },
            fr: {
                p1: "cartes en main", p2: "secondes par tour", p3: "points pour gagner",
                text: [

                    "<b>玩家：</b>4至7人。每人手持6张牌。",
                    "<b>1.</b> 一名玩家担任讲述者，选一张牌并给出线索。",
                    "<b>2.</b> 其他人看到线索后，从自己手牌中选一张也符合的牌。",
                    "<b>3.</b> 所有牌洗混后摆在桌面上。",
                    "<b>4.</b> 玩家投票猜讲述者的牌，不能投给自己的牌。",

                    "<b>换牌：</b>花5分可以更换全部手牌。",
                    "<b>胜利：</b>率先达到30分者获胜。"
                ]
            }
        };

        const p = PRAVILA[YAZYK] || PRAVILA.ru;

        document.getElementById("p1").textContent = p.p1;
        document.getElementById("p2").textContent = p.p2;
        document.getElementById("p3").textContent = p.p3;

        let html = "";
        for (const stroka of p.text) {
            html += "<p>" + stroka + "</p>";
        }
        document.getElementById("tekst-pravil").innerHTML = html;
    </script>

</body>
</html>
