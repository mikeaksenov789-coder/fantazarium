<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Комната - Фантазариум</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="zvezdy"></div>

    <div class="kosmos">
        <div class="planeta ledyanoy"></div>
        <div class="planeta kamenistaya"></div>
        <div class="planeta zemlepodobnaya"></div>
        <div class="kometa kometa-1"></div>
        <div class="kometa kometa-2"></div>
        <div class="sputnik sputnik-2">
            <div class="panel panel-l"></div>
            <div class="korpus"></div>
            <div class="antenna"></div>
            <div class="panel panel-r"></div>
        </div>
    </div>

    <div class="container">
        <p class="nadzagolovok">зал ожидания</p>
        <h2>Комната</h2>

        <div class="kod-komnaty" id="kod">.....</div>
        <button class="knopka-kopirovat" onclick="skopirovat()" id="knopka-kopii">Скопировать ссылку</button>

        <h3 class="zagolovok-spiska">Игроки</h3>

        <div class="spisok-igrokov" id="spisok">
            <p>Загрузка...</p>
        </div>

        <p class="podskazka" id="podskazka"></p>

        <div class="knopki" id="mesto-knopki"></div>

        <div class="blok-info">
            <h4>Пока ждём</h4>
            <p>Отправь друзьям код или прямую ссылку на эту страницу. Каждый игрок должен нажать кнопку Готов. Когда готовы все и собралось минимум четыре человека, хозяин комнаты запускает партию.</p>
        </div>

        <a href="/lobbi" class="ssylka-nazad">Выйти</a>
    </div>

    <script>
        const kod = window.location.pathname.split("/").pop();
        document.getElementById("kod").textContent = kod;

        let proshlyy_spisok = "";
        let proshlaya_knopka = "";

        function skopirovat() {
            navigator.clipboard.writeText(window.location.href);
            const k = document.getElementById("knopka-kopii");
            k.textContent = "Ссылка скопирована";
            setTimeout(function () { k.textContent = "Скопировать ссылку"; }, 2000);
        }

        async function obnovit() {
            const otvet = await fetch("/api/komnata/" + kod);
            const d = await otvet.json();

            if (d.oshibka) {
                document.getElementById("spisok").innerHTML = "<p>Комната не найдена</p>";
                return;
            }

            if (d.status !== "ozhidanie") {
                window.location.href = "/igra/" + kod;
                return;
            }

            let html = "";
            for (const igrok of d.igroki) {
                const klass = igrok.gotov ? "igrok igrok-gotov" : "igrok";
                const znak = igrok.gotov
                    ? "<span class='znak znak-da'>✓</span>"
                    : "<span class='znak znak-net'>✕</span>";

                html += "<div class='" + klass + "'>";
                html += "<span class='levaya-igroka'>" + znak + "<span>" + igrok.login + "</span>";
                if (igrok.login === d.hozyain) {
                    html += "<span class='metka-hozyain'>хозяин</span>";
                }
                html += "</span>";
                html += igrok.gotov
                    ? "<span class='status-gotov'>готов</span>"
                    : "<span class='status-ne-gotov'>ждём</span>";
                html += "</div>";
            }
            if (html !== proshlyy_spisok) {
                document.getElementById("spisok").innerHTML = html;
                proshlyy_spisok = html;
            }

            const skolko = d.igroki.length;
            const podskazka = document.getElementById("podskazka");

            if (skolko < 4) {
                podskazka.textContent = "Нужно минимум 4 игрока. Сейчас: " + skolko;
                podskazka.className = "podskazka";
            } else if (!d.vse_gotovy) {
                podskazka.textContent = "Готовы " + d.gotovyh + " из " + skolko;
                podskazka.className = "podskazka";
            } else {
                podskazka.textContent = "Все готовы! Можно начинать";
                podskazka.className = "podskazka podskazka-gotovo";
            }

            let knopka = "";

            if (d.ya_gotov) {
                knopka += "<button class='knopka knopka-otmena-gotov' onclick='gotovnost()'>Я не готов</button>";
            } else {
                knopka += "<button class='knopka knopka-gotov' onclick='gotovnost()'>Готов</button>";
            }

            if (d.ya === d.hozyain && skolko >= 4 && d.vse_gotovy) {
                knopka += "<form method='post' action='/nachat_igru'>" +
                          "<input type='hidden' name='kod' value='" + kod + "'>" +
                          "<button type='submit' class='knopka knopka-glavnaya'>Начать игру</button></form>";
            }

            if (knopka !== proshlaya_knopka) {
                document.getElementById("mesto-knopki").innerHTML = knopka;
                proshlaya_knopka = knopka;
            }
        }

        async function gotovnost() {
            const f = new FormData();
            f.append("kod", kod);
            await fetch("/gotovnost", { method: "POST", body: f });
            obnovit();
        }

        obnovit();
        setInterval(obnovit, 2000);
    </script>

</body>
</html>
