<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Комната - Фантазариум</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/lang.js"></script>
</head>
<body>

    <div class="zvezdy"></div>

    <div class="kosmos">
        <div class="planeta ledyanoy"></div>
        <div class="planeta kamenistaya"></div>
        <div class="kometa kometa-1"></div>
    </div>

    <div class="container">
        <p class="nadzagolovok" id="tip-komnaty"></p>
        <h2 data-t="komnata">Комната</h2>

        <div class="plashka-koloda" id="plashka-koloda"></div>

        <div class="kod-komnaty" id="kod">.....</div>
        <button class="knopka-kopirovat" onclick="skopirovat()" id="knopka-kopii"></button>

        <h3 class="zagolovok-spiska" data-t="igroki">Игроки</h3>

        <div class="spisok-igrokov" id="spisok"></div>

        <p class="podskazka" id="podskazka"></p>

        <div class="knopki" id="mesto-knopki"></div>

        <a href="/lobbi" class="ssylka-nazad" data-t="vyyti">Выйти</a>
    </div>

    <script>
        const kod = window.location.pathname.split("/").pop();
        document.getElementById("kod").textContent = kod;
        document.getElementById("knopka-kopii").textContent = t("kopirovat");

        let proshlyy_spisok = "";
        let proshlaya_knopka = "";

        function skopirovat() {
            navigator.clipboard.writeText(window.location.href);
            const k = document.getElementById("knopka-kopii");
            k.textContent = t("skopirovano");
            setTimeout(function () { k.textContent = t("kopirovat"); }, 2000);
        }

        async function obnovit() {
            const otvet = await fetch("/api/komnata/" + kod);
            const d = await otvet.json();

            if (d.oshibka) {
                document.getElementById("spisok").innerHTML = "<p>" + t("oshibka_kod") + "</p>";
                return;
            }

            if (d.status !== "ozhidanie") {
                window.location.href = "/igra/" + kod;
                return;
            }

            document.getElementById("tip-komnaty").textContent =
                d.publichnaya ? t("otkrytaya") : t("zakrytaya");

            const plashka = document.getElementById("plashka-koloda");
            plashka.textContent = t(d.koloda);
            plashka.className = "plashka-koloda plashka-" + d.koloda;

            let html = "";
            for (const igrok of d.igroki) {
                const klass = igrok.gotov ? "igrok igrok-gotov" : "igrok";

                html += "<div class='" + klass + "'>";
                html += "<div class='levaya-igroka'>";
                html += "<span class='imya-v-spiske'>" + igrok.login + "</span>";
                if (igrok.login === d.hozyain) {
                    html += "<span class='metka-hozyain'>" + t("hozyain") + "</span>";
                }
                html += "</div>";
                html += igrok.gotov
                    ? "<div class='plashka-status plashka-gotov'>" + t("st_gotov") + "</div>"
                    : "<div class='plashka-status plashka-zhdem'>" + t("st_ne_gotov") + "</div>";
                html += "</div>";
            }

            if (html !== proshlyy_spisok) {
                document.getElementById("spisok").innerHTML = html;
                proshlyy_spisok = html;
            }

            const skolko = d.igroki.length;
            const podskazka = document.getElementById("podskazka");

            if (skolko < 4) {
                podskazka.textContent = t("nuzhno_igrokov") + " " + skolko;
                podskazka.className = "podskazka";
            } else if (!d.vse_gotovy) {
                podskazka.textContent = t("gotovy") + ": " + d.gotovyh + " " + t("iz") + " " + skolko;
                podskazka.className = "podskazka";
            } else {
                podskazka.textContent = t("vse_gotovy");
                podskazka.className = "podskazka podskazka-gotovo";
            }

            let knopka = "";
            knopka += d.ya_gotov
                ? "<button class='knopka knopka-otmena-gotov' onclick='gotovnost()'>" + t("ne_gotov_knopka") + "</button>"
                : "<button class='knopka knopka-gotov' onclick='gotovnost()'>" + t("gotov") + "</button>";

            if (d.ya === d.hozyain && skolko >= 4 && d.vse_gotovy) {
                knopka += "<form method='post' action='/nachat_igru'>" +
                          "<input type='hidden' name='kod' value='" + kod + "'>" +
                          "<button type='submit' class='knopka knopka-glavnaya'>" +
                          t("nachat_igru") + "</button></form>";
            }

            if (knopka !== proshlaya_knopka) {
                document.getElementById("mesto-knopki").innerHTML = knopka;
                proshlaya_knopka = knopka;
            }
        }

        async function gotovnost() {
            const f = new FormData();
            f.append("kod", kod);
            await fetch("/gotovnost", { method: "POST", body: f });
            obnovit();
        }

        obnovit();
        setInterval(obnovit, 2000);
    </script>

</body>
</html>
