<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Фантазариум</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="kosmos">
        <div class="planeta planeta-2"></div>
        <div class="planeta planeta-3"></div>
        <div class="planeta planeta-4"></div>
        <div class="planeta-koltso"></div>
        <div class="luna luna-2"></div>
        <div class="kometa kometa-1"></div>
        <div class="kometa kometa-2"></div>
        <div class="korabl korabl-1">🛸</div>
        <div class="korabl korabl-3">🛰️</div>
    </div>

    <div class="container">
        <p class="nadzagolovok">добро пожаловать</p>
        <h2>Вход в игру</h2>

        <div class="soobshenie" id="soobshenie"></div>

        <form class="forma" method="post" action="/vhod">
            <input type="text" name="login" placeholder="Логин" class="pole" required autocomplete="username">
            <input type="password" name="parol" placeholder="Пароль" class="pole" required autocomplete="current-password">
            <button type="submit" class="knopka knopka-glavnaya">Войти</button>
        </form>

        <a href="/registraciya" class="ssylka-nazad">Ещё нет аккаунта? Зарегистрируйся</a>

        <div class="blok-info">
            <h4>Как начать</h4>
            <p>Войди в аккаунт, создай комнату и получи код из пяти символов. Отправь его друзьям, они введут код и присоединятся к тебе.</p>
        </div>

        <p class="podskazka-nizu">Для партии нужно от четырёх до семи игроков.</p>
    </div>

    <script>
        const parametry = new URLSearchParams(window.location.search);
        if (parametry.get("oshibka") === "1") {
            const blok = document.getElementById("soobshenie");
            blok.textContent = "Неверный логин или пароль";
            blok.className = "soobshenie soobshenie-vidno";
        }
    </script>

</body>
</html>
