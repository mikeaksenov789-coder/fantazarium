<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лобби - Фантазариум</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/lang.js"></script>
</head>
<body>

    <div class="zvezdy"></div>

    <div class="kosmos">
        <div class="planeta gazoviy"></div>
        <div class="planeta ledyanoy"></div>
        <div class="kometa kometa-1"></div>
    </div>

    <div class="container">
        <p class="nadzagolovok">выбери колоду</p>
        <h2>Быстрая игра</h2>
        <p class="podzagolovok">Нажми на колоду, и тебя подберут к другим игрокам</p>

        <div class="soobshenie" id="soobshenie"></div>

        <div class="kolody" id="kolody">
            <p class="podzagolovok">Загрузка колод...</p>
        </div>

        <div class="razdelitel"><span>или играй только с друзьями</span></div>

        <div class="blok-druzya">
            <form class="forma" method="post" action="/sozdat_komnatu">
                <p class="podpis-nad-polem">Какой колодой будете играть</p>
                <select name="koloda" class="pole vybor-kolody">
                    <option value="omut">Тихий омут</option>
                    <option value="balagan">Шумный балаган</option>
                </select>
                <button type="submit" class="knopka">Создать закрытую комнату</button>
            </form>

            <div class="razdelitel-tonkiy"></div>

            <form class="forma" method="post" action="/voyti_v_komnatu">
                <p class="podpis-nad-polem">Уже есть код от друга</p>
                <input type="text" name="kod" class="pole" required maxlength="5" placeholder="Код комнаты">
                <button type="submit" class="knopka">Войти по коду</button>
            </form>
        </div>

        <a href="/glavnaya" class="ssylka-nazad">На главную</a>
    </div>

    <script>
        async function zagruzit_kolody() {
            const blok = document.getElementById("kolody");

            try {
                const otvet = await fetch("/api/kolody");

                if (!otvet.ok) {
                    blok.innerHTML = "<p class='podzagolovok'>Не удалось загрузить колоды</p>";
                    return;
                }

                const d = await otvet.json();

                if (!d.kolody || d.kolody.length === 0) {
                    blok.innerHTML = "<p class='podzagolovok'>Колоды не найдены</p>";
                    return;
                }

                let html = "";
                for (const k of d.kolody) {
                    const podpis = k.igraet > 0
                        ? "<span class='ishchut'>сейчас ищут игру: " + k.igraet + "</span>"
                        : "<span class='nikogo'>сейчас никого нет</span>";

                    html += "<form method='post' action='/bystraya_igra' class='karta-kolody'>";
                    html += "<input type='hidden' name='koloda' value='" + k.kod + "'>";
                    html += "<button type='submit' class='knopka-koloda koloda-" + k.kod + "'>";
                    html += "<span class='koloda-imya'>" + k.nazvanie + "</span>";
                    html += "<span class='koloda-opis'>" + k.opisanie + "</span>";
                    html += "<span class='koloda-niz'>" + k.kart + " карт &nbsp;·&nbsp; " + podpis + "</span>";
                    html += "</button></form>";
                }

                blok.innerHTML = html;

            } catch (e) {
                blok.innerHTML = "<p class='podzagolovok'>Ошибка связи с сервером</p>";
            }
        }

        const parametry = new URLSearchParams(window.location.search);
        const oshibka = parametry.get("oshibka");
        const soob = document.getElementById("soobshenie");

        if (oshibka === "net") {
            soob.textContent = "Комната с таким кодом не найдена";
            soob.className = "soobshenie soobshenie-vidno";
        } else if (oshibka === "idet") {
            soob.textContent = "В этой комнате игра уже началась или нет мест";
            soob.className = "soobshenie soobshenie-vidno";
        }

        zagruzit_kolody();
        setInterval(zagruzit_kolody, 5000);
    </script>

</body>
</html>
