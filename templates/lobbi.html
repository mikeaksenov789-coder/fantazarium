<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лобби - Фантазариум</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/lang.js"></script>
</head>
<body>

    <div class="zvezdy"></div>

    <div class="kosmos">
        <div class="planeta gazoviy"></div>
        <div class="planeta ledyanoy"></div>
        <div class="kometa kometa-1"></div>
    </div>

    <div class="container">
        <p class="nadzagolovok" data-t="vyberi_kolodu">выбери колоду</p>
        <h2 data-t="bystraya_igra">Быстрая игра</h2>

        <div class="soobshenie" id="soobshenie"></div>

        <div class="kolody" id="kolody">
            <p class="podzagolovok">...</p>
        </div>

        <div class="razdelitel"><span data-t="ili_druzya">или играй с друзьями</span></div>

        <div class="blok-druzya">
            <form class="forma" method="post" action="/sozdat_komnatu">
                <select name="koloda" class="pole vybor-kolody" id="vybor-kolody-sozdat"></select>
                <button type="submit" class="knopka" data-t="sozdat_zakrytuyu">Создать закрытую комнату</button>
            </form>

            <form class="forma" method="post" action="/voyti_v_komnatu" style="margin-top: 16px;">
                <input type="text" name="kod" class="pole" required maxlength="5" data-tp="kod_komnaty">
                <button type="submit" class="knopka" data-t="voyti_po_kodu">Войти по коду</button>
            </form>
        </div>

        <a href="/glavnaya" class="ssylka-nazad" data-t="na_glavnuyu">На главную</a>
    </div>

    <script>
        function napolnit_vybor() {
            const vybor = document.getElementById("vybor-kolody-sozdat");
            vybor.innerHTML =
                "<option value='omut'>" + t("omut") + "</option>" +
                "<option value='balagan'>" + t("balagan") + "</option>";
        }

        async function zagruzit_kolody() {
            const otvet = await fetch("/api/kolody");
            const d = await otvet.json();

            let html = "";
            for (const k of d.kolody) {
                const podpis = k.igraet > 0
                    ? "<span class='ishchut'>" + t("ishchut") + " " + k.igraet + "</span>"
                    : "<span class='nikogo'>" + t("nikogo") + "</span>";

                html += "<form method='post' action='/bystraya_igra' class='karta-kolody'>";
                html += "<input type='hidden' name='koloda' value='" + k.kod + "'>";
                html += "<button type='submit' class='knopka-koloda koloda-" + k.kod + "'>";
                html += "<span class='koloda-imya'>" + t(k.kod) + "</span>";
                html += "<span class='koloda-opis'>" + t(k.kod + "_opis") + "</span>";
                html += "<span class='koloda-niz'>" + k.kart + " " + t("kart") +
                        " &nbsp;·&nbsp; " + podpis + "</span>";
                html += "</button></form>";
            }

            document.getElementById("kolody").innerHTML = html;
        }

        const parametry = new URLSearchParams(window.location.search);
        const oshibka = parametry.get("oshibka");
        const blok = document.getElementById("soobshenie");

        if (oshibka === "net") {
            blok.textContent = t("oshibka_kod");
            blok.className = "soobshenie soobshenie-vidno";
        } else if (oshibka === "idet") {
            blok.textContent = t("oshibka_idet");
            blok.className = "soobshenie soobshenie-vidno";
        }

        napolnit_vybor();
        zagruzit_kolody();
        setInterval(zagruzit_kolody, 5000);
    </script>

</body>
</html>
