<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра - Фантазариум</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="zvezdy"></div>

    <div class="kosmos">
        <div class="planeta gazoviy"></div>
        <div class="kometa kometa-2"></div>
    </div>

    <div class="igrovoy-ekran">

        <div class="shapka">
            <div class="shapka-levo">
                <span class="shapka-kod" id="kod">.....</span>
                <span class="shapka-raund" id="raund"></span>
            </div>
            <div class="shapka-taymer" id="shapka-taymer">
                <span class="shapka-cifry" id="taymer-cifry">120</span>
                <span class="shapka-sek">сек</span>
            </div>
            <button class="knopka-vyhod" onclick="vyyti()">Выйти</button>
        </div>

        <div class="polosa-vremeni" id="polosa" style="width: 0%"></div>

        <div class="lenta-igrokov" id="lenta"></div>

        <div class="pole-igry">
            <div class="stol-krug" id="stol-krug"></div>
        </div>

        <div class="stol" id="stol">
            <p>Загрузка...</p>
        </div>

        <div class="moya-ruka" id="blok-ruki">
            <h3 class="zagolovok-ruki" id="zagolovok-ruki">Твои карточки</h3>
            <div class="setka-kart" id="karty"></div>
            <div class="panel-zameny" id="panel-zameny"></div>
        </div>

        <div class="niz-panel" id="niz-panel"></div>

    </div>

    <div class="modal" id="modal">
        <div class="modal-fon" onclick="zakryt_modal()"></div>
        <div class="modal-okno">
            <div class="modal-taymer" id="modal-taymer">
                <span class="shapka-cifry" id="modal-cifry">120</span>
                <span class="shapka-sek">сек</span>
            </div>
            <div class="ryad-prosmotra">
                <button class="strelka" onclick="listat(-1)">‹</button>
                <img class="modal-karta" id="modal-karta" src="">
                <button class="strelka" onclick="listat(1)">›</button>
            </div>
            <div class="schetchik-kart" id="schetchik"></div>
            <div class="tochki-kart" id="tochki"></div>
            <div class="modal-knopki" id="modal-knopki"></div>
        </div>
    </div>

    <script>
        const kod = window.location.pathname.split("/").pop();
        document.getElementById("kod").textContent = kod;

        let vybrannaya = null;
        let mozhno_vybirat = false;
        let posledniye_dannye = null;

        let proshlyy_stol = "";
        let proshlyy_niz = "";
        let proshlaya_zamena = "";
        let proshlie_mesta = "";
        let proshlaya_lenta = "";
        let klyuch_ruki = "";

        let modal_otkryt = false;
        let spisok_prosmotra = [];
        let tekushiy_index = 0;
        let rezhim_prosmotra = "prosmotr";

        let konec_vremeni = null;
        let vsego_sekund = 120;

        async function obnovit() {
            let d;
            try {
                const otvet = await fetch("/api/igra/" + kod);
                d = await otvet.json();
            } catch (e) {
                return;
            }
            if (d.oshibka) { return; }

            if (d.status === "ozhidanie") {
                window.location.href = "/komnata/" + kod;
                return;
            }

            posledniye_dannye = d;

            if (d.vsego_sekund) { vsego_sekund = d.vsego_sekund; }

            document.getElementById("raund").textContent =
                d.status === "konec" ? "Конец" : "Раунд " + d.nomer_raunda;

            if (d.ostalos === null || d.ostalos === undefined) {
                konec_vremeni = null;
            } else {
                konec_vremeni = Date.now() + d.ostalos * 1000;
            }
            narisovat_taymer();

            narisovat_lentu(d);
            narisovat_mesta(d);
            narisovat_stol(d);
            narisovat_karty(d);
            narisovat_zamenu(d);
            narisovat_niz(d);
        }

        function narisovat_taymer() {
            const blok = document.getElementById("shapka-taymer");
            const polosa = document.getElementById("polosa");
            const mod = document.getElementById("modal-taymer");

            if (konec_vremeni === null) {
                blok.className = "shapka-taymer";
                mod.className = "modal-taymer";
                polosa.style.width = "0%";
                return;
            }

            const ostalos = Math.max(0, Math.ceil((konec_vremeni - Date.now()) / 1000));

            document.getElementById("taymer-cifry").textContent = ostalos;
            document.getElementById("modal-cifry").textContent = ostalos;

            let dop = "";
            let dop_polosa = "";
            if (ostalos <= 15) { dop = " taymer-kr"; dop_polosa = " polosa-kr"; }
            else if (ostalos <= 40) { dop = " taymer-zh"; dop_polosa = " polosa-zh"; }

            blok.className = "shapka-taymer shapka-taymer-vidno" + dop;
            mod.className = modal_otkryt ? "modal-taymer modal-taymer-vidno" + dop : "modal-taymer";

            polosa.className = "polosa-vremeni" + dop_polosa;
            polosa.style.width = (ostalos / vsego_sekund * 100) + "%";
        }

        function status_igroka(d, igrok) {
            if (d.status === "itogi") {
                return igrok.gotov
                    ? { klass: "plitka-gotov", znak: "<span class='znak-ok'>готов</span>" }
                    : { klass: "plitka-zhdem", znak: "<span class='znak-zhdem'>ждём</span>" };
            }
            if (igrok.login === d.vedushiy) {
                return { klass: "plitka-vedushiy", znak: "<span class='znak-vedushiy'>ведущий</span>" };
            }
            if (d.zhdem.indexOf(igrok.login) !== -1) {
                return { klass: "plitka-zhdem", znak: "<span class='znak-zhdem'>ходит</span>" };
            }
            if (d.status === "otvety" || d.status === "golosovanie") {
                return { klass: "plitka-gotov", znak: "<span class='znak-ok'>готов</span>" };
            }
            return { klass: "", znak: "" };
        }

        function narisovat_lentu(d) {
            let html = "";

            for (const igrok of d.igroki) {
                const st = status_igroka(d, igrok);
                const bukva = igrok.login.charAt(0).toUpperCase();

                html += "<div class='igrok-plitka " + st.klass + "'>" +
                        "<div class='plitka-avatar'>" + bukva + "</div>" +
                        "<div class='plitka-imya'>" + igrok.login + "</div>" +
                        "<div class='plitka-ochki'>" + igrok.ochki + "</div>" +
                        "<div class='plitka-znak'>" + st.znak + "</div>" +
                        "</div>";
            }

            if (html !== proshlaya_lenta) {
                document.getElementById("lenta").innerHTML = html;
                proshlaya_lenta = html;
            }
        }

        function narisovat_mesta(d) {
            const vsego = d.igroki.length;
            let html = "";

            for (let i = 0; i < vsego; i++) {
                const igrok = d.igroki[i];

                const ugol = (i / vsego) * 2 * Math.PI - Math.PI / 2;
                const x = 50 + 50 * Math.cos(ugol);
                const y = 50 + 52 * Math.sin(ugol);

                let klass = "mesto";
                let bejdzh = "";

                if (igrok.login === d.ya) { klass += " mesto-ya"; }

                if (d.status === "itogi") {
                    if (igrok.gotov) {
                        klass += " mesto-gotov";
                        bejdzh = "<div class='bejdzh bejdzh-gotov'>ГОТОВ</div>";
                    } else {
                        klass += " mesto-zhdem";
                        bejdzh = "<div class='bejdzh bejdzh-zhdem'>ЖДЁМ</div>";
                    }
                } else if (igrok.login === d.vedushiy) {
                    klass += " mesto-vedushiy";
                    bejdzh = "<div class='bejdzh bejdzh-hodit'>ВЕДУЩИЙ</div>";
                } else if (d.zhdem.indexOf(igrok.login) !== -1) {
                    klass += " mesto-zhdem";
                    bejdzh = "<div class='bejdzh bejdzh-zhdem'>ХОДИТ</div>";
                } else if (d.status === "otvety" || d.status === "golosovanie") {
                    klass += " mesto-gotov";
                    bejdzh = "<div class='bejdzh bejdzh-gotov'>ГОТОВ</div>";
                }

                const bukva = igrok.login.charAt(0).toUpperCase();

                html += "<div class='" + klass + "' style='left:" + x + "%; top:" + y + "%;'>" +
                        "<div class='avatar'>" + bukva + "</div>" +
                        "<div class='imya-igroka'>" + igrok.login + "</div>" +
                        "<div class='ochki-igroka'>" + igrok.ochki + "</div>" +
                        bejdzh +
                        "</div>";
            }

            if (html !== proshlie_mesta) {
                document.getElementById("stol-krug").innerHTML = html;
                proshlie_mesta = html;
            }
        }

        function narisovat_stol(d) {
            let html = "";

            if (d.status === "konec") {
                html = "<h3 class='zagolovok-stola'>Партия окончена</h3><div class='pedestal'>";
                for (const igrok of d.tablica) {
                    let klass = "stroka-itoga";
                    let medal = "";
                    if (igrok.mesto === 1) { klass += " pobeditel"; medal = "🏆 "; }
                    else if (igrok.mesto === 2) { medal = "🥈 "; }
                    else if (igrok.mesto === 3) { medal = "🥉 "; }
                    html += "<div class='" + klass + "'><span>" + medal + igrok.mesto +
                            ". " + igrok.login + "</span><span class='ochki-itog'>" +
                            igrok.ochki + "</span></div>";
                }
                html += "</div>";

                if (d.ya === d.hozyain) {
                    html += "<button class='knopka knopka-glavnaya' onclick='igrat_snova()'>Играть снова</button>";
                } else {
                    html += "<p class='podzagolovok'>Хозяин может начать новую партию</p>";
                }
                html += "<br><a href='/lobbi' class='ssylka-nazad'>Выйти в лобби</a>";
            }

            else if (d.status === "associaciya") {
                if (d.ya_vedushiy) {
                    html = "<div class='tablichka-hodit'>Ты ведущий</div>" +
                        "<p class='podzagolovok'>Выбери карточку и придумай ассоциацию</p>" +
                        "<input type='text' id='pole-associacii' class='pole' placeholder='Ассоциация' maxlength='80'>" +
                        "<br><br><button class='knopka knopka-glavnaya' onclick='zagadat()'>Загадать</button>";
                } else {
                    html = "<div class='tablichka-hodit'>Ходит " + d.vedushiy + "</div>" +
                        "<p class='podzagolovok'>Придумывает ассоциацию...</p>";
                }
            }

            else if (d.status === "otvety") {
                html = "<div class='associaciya'>" + d.associaciya + "</div>";
                if (d.ya_vedushiy) {
                    html += "<p class='podzagolovok'>Сдали: " + d.sdali + " из " + d.igroki.length + "</p>";
                } else if (d.ya_sdal) {
                    html += "<p class='podzagolovok'>Ты сдал карточку. Сдали: " + d.sdali +
                            " из " + d.igroki.length + "</p>";
                } else {
                    html += "<div class='tablichka-hodit'>Твой ход</div>" +
                            "<button class='knopka knopka-glavnaya' onclick='sdat()'>Сдать карточку</button>";
                }
            }

            else if (d.status === "golosovanie") {
                html = "<div class='associaciya'>" + d.associaciya + "</div>";

                if (d.ya_vedushiy) {
                    html += "<p class='podzagolovok'>Проголосовали: " + d.progolosovali +
                            " из " + d.vsego_golosuet + "</p>";
                } else if (!d.ya_mogu_golosovat) {
                    html += "<div class='ne-golosuet'>Ты не успел сдать карточку, в этом раунде не голосуешь</div>";
                } else if (d.ya_golosoval) {
                    html += "<p class='podzagolovok'>Ты проголосовал. Проголосовали: " +
                            d.progolosovali + " из " + d.vsego_golosuet + "</p>";
                } else {
                    html += "<div class='tablichka-hodit'>Угадай карточку ведущего</div>";
                }

                html += "<div class='setka-stola'>";
                for (let i = 0; i < d.karty_na_stole.length; i++) {
                    const k = d.karty_na_stole[i];
                    let klass = "karta-stola";
                    if (k.moya) { klass += " karta-moya"; }
                    html += "<img src='/static/cards/" + k.karta + "' class='" + klass +
                            "' decoding='async' onclick='otkryt_stol(" + i + ")'>";
                }
                html += "</div>";
            }

            else if (d.status === "itogi") {
                html = "<h3 class='zagolovok-stola'>Итоги раунда</h3>" +
                       "<div class='associaciya'>" + d.associaciya + "</div><div class='setka-stola'>";
                for (let i = 0; i < d.itogi.length; i++) {
                    const k = d.itogi[i];
                    let klass = "karta-stola";
                    if (k.eto_vedushego) { klass += " karta-pravilnaya"; }
                    html += "<div class='blok-itoga'><img src='/static/cards/" + k.karta +
                            "' class='" + klass + "' decoding='async' onclick='otkryt_itogi(" + i + ")'>" +
                            "<div class='avtor'>" + k.avtor +
                            (k.eto_vedushego ? " ★" : "") + "</div>";
                    if (k.golosovali.length > 0) {
                        html += "<div class='golosa'>" + k.golosovali.join(", ") + "</div>";
                    }
                    html += "</div>";
                }
                html += "</div><br>";

                html += "<p class='podzagolovok'>Готовы " + d.gotovyh + " из " + d.igroki.length + "</p>";

                if (d.ya_gotov) {
                    html += "<button class='knopka knopka-otmena-gotov' onclick='gotovnost()'>Я не готов</button>";
                } else {
                    html += "<button class='knopka knopka-gotov' onclick='gotovnost()'>Готов</button>";
                }
            }

            if (html !== proshlyy_stol) {
                document.getElementById("stol").innerHTML = html;
                proshlyy_stol = html;
            }
        }

        function narisovat_karty(d) {
            const blok = document.getElementById("blok-ruki");

            if (d.status === "golosovanie" || d.status === "itogi" || d.status === "konec") {
                blok.style.display = "none";
                return;
            }
            blok.style.display = "block";

            mozhno_vybirat =
                (d.status === "associaciya" && d.ya_vedushiy) ||
                (d.status === "otvety" && !d.ya_vedushiy && !d.ya_sdal);

            document.getElementById("zagolovok-ruki").textContent =
                mozhno_vybirat ? "Твои карточки, нажми чтобы открыть" : "Твои карточки";

            const noviy_klyuch = d.moi_karty.join(",");

            if (noviy_klyuch !== klyuch_ruki) {
                let html = "";
                for (let i = 0; i < d.moi_karty.length; i++) {
                    html += "<img src='/static/cards/" + d.moi_karty[i] +
                            "' class='karta' decoding='async' onclick='otkryt_ruku(" + i + ")'>";
                }
                document.getElementById("karty").innerHTML = html;
                klyuch_ruki = noviy_klyuch;
            }

            obnovit_klassy_kart(d);
        }

        function obnovit_klassy_kart(d) {
            const kartinki = document.getElementById("karty").children;

            for (let i = 0; i < kartinki.length; i++) {
                let klass = "karta";
                if (d.moi_karty[i] === vybrannaya) { klass += " karta-vybrana"; }
                if (!mozhno_vybirat) { klass += " karta-neaktivna"; }
                if (kartinki[i].className !== klass) {
                    kartinki[i].className = klass;
                }
            }
        }

        function narisovat_zamenu(d) {
            let html = "";

            if ((d.status === "associaciya" || d.status === "otvety") && !d.ya_sdal) {
                html += "<span class='moi-ochki'>Очки: " + d.moi_ochki + "</span>";

                if (d.mogu_zamenit) {
                    html += "<button class='knopka-zamena' onclick='zamenit()'>" +
                            "Заменить карточки за " + d.cena_zameny + "</button>";
                } else if (d.moi_ochki < d.cena_zameny) {
                    html += "<span class='moi-ochki'>Замена стоит " + d.cena_zameny + "</span>";
                }
            }

            if (html !== proshlaya_zamena) {
                document.getElementById("panel-zameny").innerHTML = html;
                proshlaya_zamena = html;
            }
        }

        function narisovat_niz(d) {
            let html = "";

            if (d.ya === d.hozyain && d.zhdem.length > 0 &&
                (d.status === "associaciya" || d.status === "itogi")) {
                for (const kogo of d.zhdem) {
                    if (kogo !== d.ya) {
                        html += "<button class='knopka-malenkaya knopka-opasnaya' onclick='propustit(\"" +
                                kogo + "\")'>Исключить " + kogo + "</button>";
                    }
                }
            }

            if (html !== proshlyy_niz) {
                document.getElementById("niz-panel").innerHTML = html;
                proshlyy_niz = html;
            }
        }

        async function zamenit() {
            const d = posledniye_dannye;
            if (!confirm("Заменить все карточки за " + d.cena_zameny + " очков?")) { return; }

            const f = new FormData();
            f.append("kod", kod);
            const otvet = await fetch("/zamenit_karty", { method: "POST", body: f });
            const rezultat = await otvet.json();

            if (rezultat.oshibka) { alert(rezultat.oshibka); }

            vybrannaya = null;
            klyuch_ruki = "";
            obnovit();
        }

        function otkryt_ruku(index) {
            const d = posledniye_dannye;
            spisok_prosmotra = [];
            for (const k of d.moi_karty) {
                spisok_prosmotra.push({ fayl: k, mozhno: mozhno_vybirat });
            }
            rezhim_prosmotra = "vybor";
            tekushiy_index = index;
            pokazat_modal();
        }

        function otkryt_stol(index) {
            const d = posledniye_dannye;
            spisok_prosmotra = [];
            for (const k of d.karty_na_stole) {
                const mozhno = !k.moya && d.ya_mogu_golosovat && !d.ya_golosoval;
                spisok_prosmotra.push({ fayl: k.karta, mozhno: mozhno });
            }
            rezhim_prosmotra = "golos";
            tekushiy_index = index;
            pokazat_modal();
        }

        function otkryt_itogi(index) {
            const d = posledniye_dannye;
            spisok_prosmotra = [];
            for (const k of d.itogi) {
                spisok_prosmotra.push({ fayl: k.karta, mozhno: false });
            }
            rezhim_prosmotra = "prosmotr";
            tekushiy_index = index;
            pokazat_modal();
        }

        function pokazat_modal() {
            if (spisok_prosmotra.length === 0) { return; }
            document.getElementById("modal").className = "modal modal-vidno";
            modal_otkryt = true;
            narisovat_modal();
            narisovat_taymer();
        }

        function narisovat_modal() {
            const tekushaya = spisok_prosmotra[tekushiy_index];

            document.getElementById("modal-karta").src = "/static/cards/" + tekushaya.fayl;

            document.getElementById("schetchik").textContent =
                (tekushiy_index + 1) + " из " + spisok_prosmotra.length;

            let tochki = "";
            for (let i = 0; i < spisok_prosmotra.length; i++) {
                const klass = i === tekushiy_index ? "tochka-karty tochka-aktivnaya" : "tochka-karty";
                tochki += "<div class='" + klass + "' onclick='pereyti(" + i + ")'></div>";
            }
            document.getElementById("tochki").innerHTML = tochki;

            let knopki = "";
            if (rezhim_prosmotra === "vybor" && tekushaya.mozhno) {
                knopki = "<button class='knopka knopka-glavnaya' onclick='podtverdit_vybor()'>Выбрать эту</button>";
            } else if (rezhim_prosmotra === "golos" && tekushaya.mozhno) {
                knopki = "<button class='knopka knopka-glavnaya' onclick='podtverdit_golos()'>Голосовать</button>";
            }
            knopki += "<button class='knopka' onclick='zakryt_modal()'>Закрыть</button>";
            document.getElementById("modal-knopki").innerHTML = knopki;
        }

        function listat(shag) {
            const vsego = spisok_prosmotra.length;
            tekushiy_index = (tekushiy_index + shag + vsego) % vsego;
            narisovat_modal();
        }

        function pereyti(index) {
            tekushiy_index = index;
            narisovat_modal();
        }

        function zakryt_modal() {
            document.getElementById("modal").className = "modal";
            modal_otkryt = false;
            document.getElementById("modal-taymer").className = "modal-taymer";
        }

        function podtverdit_vybor() {
            vybrannaya = spisok_prosmotra[tekushiy_index].fayl;
            zakryt_modal();
            if (posledniye_dannye) { obnovit_klassy_kart(posledniye_dannye); }
        }

        async function podtverdit_golos() {
            const karta = spisok_prosmotra[tekushiy_index].fayl;
            zakryt_modal();
            const f = new FormData();
            f.append("kod", kod);
            f.append("karta", karta);
            await fetch("/golosovat", { method: "POST", body: f });
            obnovit();
        }

        async function gotovnost() {
            const f = new FormData();
            f.append("kod", kod);
            await fetch("/gotovnost", { method: "POST", body: f });
            obnovit();
        }

        async function zagadat() {
            const pole = document.getElementById("pole-associacii");
            const text = pole.value.trim();
            if (vybrannaya === null) { alert("Сначала выбери карточку"); return; }
            if (text.length === 0) { alert("Напиши ассоциацию"); return; }

            const f = new FormData();
            f.append("kod", kod);
            f.append("karta", vybrannaya);
            f.append("associaciya", text);
            await fetch("/zagadat", { method: "POST", body: f });
            vybrannaya = null;
            klyuch_ruki = "";
            obnovit();
        }

        async function sdat() {
            if (vybrannaya === null) { alert("Сначала выбери карточку"); return; }
            const f = new FormData();
            f.append("kod", kod);
            f.append("karta", vybrannaya);
            await fetch("/sdat_kartu", { method: "POST", body: f });
            vybrannaya = null;
            klyuch_ruki = "";
            obnovit();
        }

        async function igrat_snova() {
            const f = new FormData();
            f.append("kod", kod);
            await fetch("/igrat_snova", { method: "POST", body: f });
            window.location.href = "/komnata/" + kod;
        }

        async function vyyti() {
            if (!confirm("Точно выйти из игры?")) { return; }
            const f = new FormData();
            f.append("kod", kod);
            await fetch("/vyyti_iz_igry", { method: "POST", body: f });
            window.location.href = "/lobbi";
        }

        async function propustit(kogo) {
            if (!confirm("Исключить игрока " + kogo + "?")) { return; }
            const f = new FormData();
            f.append("kod", kod);
            f.append("kogo", kogo);
            await fetch("/propustit_igroka", { method: "POST", body: f });
            obnovit();
        }

        document.addEventListener("keydown", function (e) {
            if (!modal_otkryt) { return; }
            if (e.key === "Escape") { zakryt_modal(); }
            if (e.key === "ArrowLeft") { listat(-1); }
            if (e.key === "ArrowRight") { listat(1); }
        });

        let nachalo_x = 0;
        const kartinka = document.getElementById("modal-karta");

        kartinka.addEventListener("touchstart", function (e) {
            nachalo_x = e.changedTouches[0].screenX;
        }, { passive: true });

        kartinka.addEventListener("touchend", function (e) {
            const konec_x = e.changedTouches[0].screenX;
            const raznica = konec_x - nachalo_x;
            if (Math.abs(raznica) > 50) {
                listat(raznica > 0 ? -1 : 1);
            }
        }, { passive: true });

        obnovit();
        setInterval(obnovit, 2000);
        setInterval(narisovat_taymer, 1000);
    </script>

</body>
</html>
